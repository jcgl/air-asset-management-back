spring.application.name=air-asset-management
server.port=8080

# SQL Server connection
# Credentials are injected from the environment. Never commit secrets to source control.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://generator-manager.database.windows.net:1433;databaseName=manager;encrypt=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
